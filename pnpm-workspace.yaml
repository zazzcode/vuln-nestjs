packages:
  - apps/*
  - libs/*

saveExact: true

# Every peer a workspace needs is declared in its own package.json.
autoInstallPeers: false

# Nothing runs a script at install. The two database packages download their
# server binary at first use, not at install. protobufjs only builds a browser
# bundle that the lab never loads. @scarf/scarf, which swagger-ui-dist depends
# on, reports installs to its maker: the lab sends no telemetry.
allowBuilds:
  '@scarf/scarf': false
  '@apollo/protobufjs': false
  mongodb-memory-server: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@nestjs/apollo@14.2.2'
  - '@nestjs/common@12.6.3'
  - '@nestjs/core@12.6.3'
  - '@nestjs/graphql@14.2.2'
  - '@nestjs/platform-express@12.6.3'
  - '@nestjs/platform-fastify@12.6.3'
  - '@nestjs/schematics@12.0.17'
  - '@nestjs/swagger@12.1.3'
  - '@nestjs/testing@12.6.3'
  - '@oxlint-tsgolint/darwin-arm64@7.0.2009'
  - '@oxlint-tsgolint/darwin-x64@7.0.2009'
  - '@oxlint-tsgolint/linux-arm64@7.0.2009'
  - '@oxlint-tsgolint/linux-x64@7.0.2009'
  - '@oxlint-tsgolint/win32-arm64@7.0.2009'
  - '@oxlint-tsgolint/win32-x64@7.0.2009'
  - oxlint-tsgolint@7.0.2009
  - vite@8.4.0
