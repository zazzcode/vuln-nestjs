packages:
  - apps/*
  - libs/*

saveExact: true

# Every peer a workspace needs is declared in its own package.json.
autoInstallPeers: false

# Nothing runs a script at install. The two database packages download their
# server binary at first use, not at install. protobufjs only builds a browser
# bundle that the lab never loads. @scarf/scarf, which swagger-ui-dist depends
# on, reports installs to its maker: the lab sends no telemetry.
allowBuilds:
  '@scarf/scarf': false
  '@apollo/protobufjs': false
  mongodb-memory-server: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@nestjs/apollo@14.2.2'
  - '@nestjs/common@12.6.3'
  - '@nestjs/core@12.6.3'
  - '@nestjs/graphql@14.2.2'
  - '@nestjs/platform-express@12.6.3'
  - '@nestjs/platform-fastify@12.6.3'
  - '@nestjs/schematics@12.0.17'
  - '@nestjs/swagger@12.1.3'
  - '@nestjs/testing@12.6.3'
  - '@oxlint-tsgolint/darwin-arm64@7.0.2009'
  - '@oxlint-tsgolint/darwin-x64@7.0.2009'
  - '@oxlint-tsgolint/linux-arm64@7.0.2009'
  - '@oxlint-tsgolint/linux-x64@7.0.2009'
  - '@oxlint-tsgolint/win32-arm64@7.0.2009'
  - '@oxlint-tsgolint/win32-x64@7.0.2009'
  - oxlint-tsgolint@7.0.2009
  - vite@8.4.0

# The baseline is to audit clean, so that every advisory is a designed pin. On 2026-11-26 the
# registry reported five more, in packages no workspace asks for. For three of them no parent
# declares a range with the fix in it, so the override gives the patched version outside what
# the parent declares, and only to the parents that resolved a vulnerable one:
#
#   uuid 9.0.1, vulnerable below 11.1.1. Three parents under @apollo/gateway declare ^9.
#   @opentelemetry/core 1.30.1, vulnerable below 2.8.0. @apollo/gateway and eleven packages
#     under it resolve 1.30.1.
#   glob 13.0.7, vulnerable up to 14.0.1. cacache declares ^13. Its minimatch 10.2.6, vulnerable
#     below 11.0.1, leaves with it.
#
# The fourth is a range that could be met: @graphql-tools/utils 12.0.1, vulnerable up to 12.0.1.
# All take 12.1.0, which @nestjs/graphql declares. Only @apollo/server holds a lower range, below
# 12.0.2, and it imports nothing from the package.
#
# A scoped claim, as far as the lab's own suites go. The names each parent imports exist in the
# version it is given, and the OpenTelemetry packages run only inside the telemetry
# @apollo/gateway would start, which the gateway switches off in its own code. Remove an
# override once its parent declares the fix.
overrides:
  '@apollo/federation-internals>uuid': 11.1.1
  '@apollo/query-graphs>uuid': 11.1.1
  'gaxios>uuid': 11.1.1
  '@graphql-tools/utils': 12.1.0
  '@opentelemetry/core': 2.8.0
  'cacache>glob': 14.0.6
